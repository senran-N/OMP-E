name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 (MSVC + Ninja)
    runs-on: windows-latest
    steps:
      - name: Checkout OMP-E
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress

      - name: Download SDL3 3.4.20 SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".deps" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-devel-3.4.20-VC.zip" -OutFile ".deps/sdl3.zip"
          Expand-Archive -Path ".deps/sdl3.zip" -DestinationPath ".deps" -Force

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/SDL3-3.4.20"
          -DETCH_COMPILE_SHADERS=OFF
          -DOMPE_COMPILE_SHADERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run Unit Tests
        run: ctest --test-dir build --output-on-failure
