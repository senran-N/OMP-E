name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 (MSVC + Ninja)
    runs-on: windows-latest
    steps:
      - name: Checkout OMP-E
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress

      - name: Cache Prebuilt Native SDKs (SDL3 + HarfBuzz)
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: .deps/prefix
          key: win-x64-sdl3-3.4.20-hb-10.4.0

      - name: Provision SDL3 3.4.20 & Static HarfBuzz
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".deps/prefix" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-devel-3.4.20-VC.zip" -OutFile ".deps/sdl3.zip"
          Expand-Archive -Path ".deps/sdl3.zip" -DestinationPath ".deps" -Force
          Copy-Item -Recurse -Force ".deps/SDL3-3.4.20/*" ".deps/prefix/"

          git clone --depth 1 --branch 10.4.0 https://github.com/harfbuzz/harfbuzz.git .deps/harfbuzz-src
          cmake -S .deps/harfbuzz-src -B .deps/harfbuzz-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$PWD/.deps/prefix" `
            -DBUILD_SHARED_LIBS=OFF `
            -DHB_HAVE_FREETYPE=OFF `
            -DHB_HAVE_GLIB=OFF `
            -DHB_HAVE_GOBJECT=OFF `
            -DHB_HAVE_ICU=OFF `
            -DHB_BUILD_SUBSET=OFF `
            -DHB_BUILD_UTILS=OFF
          cmake --build .deps/harfbuzz-build --parallel
          cmake --install .deps/harfbuzz-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/prefix"
          -DCMAKE_DISABLE_FIND_PACKAGE_harfbuzz=ON
          -DETCH_COMPILE_SHADERS=OFF
          -DOMPE_COMPILE_SHADERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run Unit Tests
        run: ctest --test-dir build --output-on-failure
