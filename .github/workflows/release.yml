name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows x64 Installer
    runs-on: windows-latest
    steps:
      - name: Checkout OMP-E
        uses: actions/checkout@v4

      - name: Extract Version
        id: ver
        shell: pwsh
        run: |
          $tag = if ("${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v')
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja & Inno Setup
        run: choco install ninja innosetup --no-progress

      - name: Cache Prebuilt Native SDKs (SDL3 + HarfBuzz)
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: .deps/prefix
          key: win-x64-sdl3-3.4.20-hb-10.4.0

      - name: Provision SDL3 3.4.20 & Static HarfBuzz
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".deps/prefix" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-devel-3.4.20-VC.zip" -OutFile ".deps/sdl3.zip"
          Expand-Archive -Path ".deps/sdl3.zip" -DestinationPath ".deps" -Force
          Copy-Item -Recurse -Force ".deps/SDL3-3.4.20/*" ".deps/prefix/"

          git clone --depth 1 --branch 10.4.0 https://github.com/harfbuzz/harfbuzz.git .deps/harfbuzz-src
          cmake -S .deps/harfbuzz-src -B .deps/harfbuzz-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$PWD/.deps/prefix" `
            -DBUILD_SHARED_LIBS=OFF `
            -DHB_HAVE_FREETYPE=OFF `
            -DHB_HAVE_GLIB=OFF `
            -DHB_HAVE_GOBJECT=OFF `
            -DHB_HAVE_ICU=OFF `
            -DHB_BUILD_SUBSET=OFF `
            -DHB_BUILD_UTILS=OFF
          cmake --build .deps/harfbuzz-build --parallel
          cmake --install .deps/harfbuzz-build

      - name: Configure Release Build
        run: >
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/prefix"
          -DETCH_COMPILE_SHADERS=OFF
          -DOMPE_COMPILE_SHADERS=ON
          -DOMPE_RELEASE_BUILD=ON
          -DOMPE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-release --parallel

      - name: Run Unit Tests
        run: ctest --test-dir build-release --output-on-failure

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DBuildDir=..\..\build-release" "packaging\windows\omp_desktop.iss"

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $installer = "OMP-Desktop-${{ steps.ver.outputs.version }}-windows-x64-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 "dist\$installer").Hash.ToLowerInvariant()
          "$hash  $installer`n" | Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding ascii -NoNewline

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          overwrite_files: false
          generate_release_notes: true
          files: |
            dist/OMP-Desktop-${{ steps.ver.outputs.version }}-windows-x64-setup.exe
            dist/SHA256SUMS.txt
